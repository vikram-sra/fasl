<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f0e5"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E🌾%3C/text%3E%3C/svg%3E"><title>A Bowl Across Two Seasons</title><style>/* APP_CSS */</style></head><body>
<main class="game" aria-label="Automatic crop growing simulation">
 <div id="scene-art" role="img" aria-label="Living crop, surface water, soil, roots, tubewell and moving groundwater"></div>
 <header><a class="brand" href="#" aria-label="A Bowl Across Two Seasons"><svg viewBox="0 0 30 40" aria-hidden="true"><path d="M15 37V4M15 12Q2 12 4 3Q15 4 15 12M15 21Q2 21 4 12Q15 13 15 21M15 30Q2 30 4 21Q15 22 15 30M15 16Q28 16 26 7Q15 8 15 16M15 25Q28 25 26 16Q15 17 15 25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a><div class="seasons"><button data-scene="rice" aria-pressed="true">Rice <span>ਝੋਨਾ</span></button><button data-scene="wheat" aria-pressed="false">Wheat <span>ਕਣਕ</span></button></div><button class="menu" data-drawer="about" aria-label="About this simulation">☰</button></header>
 <div class="scene-heading"><h1 id="stage-title"></h1><span id="current-date"></span></div>
 <aside class="inputs" aria-label="Automatically applied crop inputs"><button data-drawer="pest_control" aria-label="Pest control bottle"><span id="pest-icon"></span><small>Pest</small></button><button data-drawer="herbicide" aria-label="Weed control bottle"><span id="weed-icon"></span><small>Weed</small></button><button data-drawer="fertilizer" aria-label="Plant food bottle"><span id="fert-icon"></span><small>Food</small></button><div class="pump-state"><span id="pump-icon">◉</span><small id="pump-used"></small></div></aside>
 <p id="weather-status" aria-live="off"></p><div id="groundwater-marker"><span class="water-tick"></span><span id="groundwater-label"></span></div>
 <footer class="timeline"><div class="timeline-caption"><button id="play" aria-label="Pause simulation">Ⅱ</button><span id="timeline-caption"></span><span class="timeline-speed">Automatic care</span></div><div id="month-list" aria-label="Season months"></div><div class="slider-wrap"><div id="timeline-ticks" aria-hidden="true"></div><input id="timeline-slider" type="range" min="0" max="304" step="0.01" value="0" aria-label="Crop growing timeline"></div><div class="timeline-endpoints"><span>Jun · rice sown</span><span id="season-transition">Oct harvest → Nov wheat</span><span>Apr · wheat harvest</span></div></footer>
</main>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-top"><span>A BOWL / EXPLORE</span><button id="close-drawer" aria-label="Close details">✕</button></div><h2 id="drawer-title"></h2><div id="drawer-content"></div></dialog>
<script>/* THREE */</script><script>/* PACKAGE_DATA */</script><script>/* SIMULATION */</script><script>/* TIMELINE */</script><script>/* SCENE_3D */</script><script>/* APPLICATION */</script></body></html>
