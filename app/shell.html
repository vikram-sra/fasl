<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe6"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E🌾%3C/text%3E%3C/svg%3E"><title>A Bowl Across Two Seasons</title><style>/* APP_CSS */</style></head><body>
<header class="masthead"><a class="brand" href="#" aria-label="A Bowl Across Two Seasons"><svg viewBox="0 0 30 40" aria-hidden="true"><path d="M15 37V4M15 12Q2 12 4 3Q15 4 15 12M15 21Q2 21 4 12Q15 13 15 21M15 30Q2 30 4 21Q15 22 15 30M15 16Q28 16 26 7Q15 8 15 16M15 25Q28 25 26 16Q15 17 15 25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>A bowl across<br>two seasons.</span></a><button data-drawer="save" class="menu" aria-label="Open game menu">☰</button></header>
<main class="game" aria-label="Crop decision game">
<div class="toolbar"><div class="segmented seasons" aria-label="Crop season"><button id="rice-tab" data-scene="rice" aria-pressed="true">Rice <span>ਝੋਨਾ</span></button><button id="wheat-tab" data-scene="wheat" aria-pressed="false">Wheat <span>ਕਣਕ</span></button></div><div class="calendar"><span id="date"></span><small id="day-label"></small></div><div class="playback"><button id="play" aria-label="Play simulation">▷</button><button id="sound" aria-label="Enable sound" aria-pressed="false">♪<span class="sound-off">off</span></button><button id="motion" aria-label="Toggle reduced motion" aria-pressed="false">≈</button></div></div>
<div class="inputbar"><button class="input" data-drawer="pest" aria-label="Pest control"><span id="pest-icon" class="container-art"></span><span><span class="input-label">Pest control</span><strong id="pest-total">0 g · 0 mL</strong><small>Only when needed</small></span></button><button class="input" data-drawer="weed" aria-label="Weed control"><span id="weed-icon" class="container-art"></span><span><span class="input-label">Weed control</span><strong id="weed-total">0 mL</strong><small>Room for roots</small></span></button><button class="input" data-drawer="fert" aria-label="Plant food"><span id="fert-icon" class="container-art"></span><span><span class="input-label">Plant food</span><strong id="fert-total">0 g</strong><small>Feed at the right time</small></span></button></div>
<div class="pump-overlay"><button id="auto-pump" aria-pressed="true">Auto pump · on</button><button data-drawer="water" class="pump-settings" aria-label="Pump settings">⚙</button></div><p id="pump-used"></p><p id="weather-status" role="status"></p><p id="aquifer-label"></p><div class="composition"><aside class="stages"><div id="month-list" aria-label="Season months"></div><div id="stage-list" role="group" aria-label="Growth stage navigation"></div></aside><div class="scene-wrap"><div class="scene-heading"><p id="scene-kicker" class="eyebrow"></p><h1 id="stage-title"></h1><p id="scene-context"></p><span id="view-badge" class="badge">LIVE FIELD</span></div><div id="scene-art" class="scene-art" role="img" aria-label="Full-screen lateral view of a crop, branching roots, pump pipe and rising or falling groundwater"></div><span class="schematic">Punjab · Side view · Illustrative water storage</span></div></div>
<button id="field-step" class="field-step" aria-label="Continue growing">→</button><section hidden aria-hidden="true" class="control-panel" aria-label="Your decisions"><div class="panel-handle"></div><div class="bowl-block"><div id="bowl-art"></div><div class="bowl-copy"><p class="eyebrow" id="bowl-basis">PER 100 G DRY FOOD</p><h2 id="bowl-title">A bowl in the making</h2><p id="bowl-info"></p><button data-drawer="harvest" class="text-link" id="harvest-link">Behind this bowl ↗</button></div><div class="units"><div class="segmented"><button data-mode="bowl" aria-pressed="true">Per bowl</button><button data-mode="acre" aria-pressed="false">1 acre</button></div></div></div>
<div class="water-strip"><button data-drawer="field"><span>Water pumped</span> <strong id="water-total"></strong> <span class="arrow">↗</span></button><span class="projection-label" id="allocation-label">Projection</span><div class="secondary-flow"><strong id="rain-total"></strong><strong id="recharge-total"></strong></div></div>
<div class="decisions"><div class="decision-head"><p class="eyebrow" id="decision-label">YOUR NEXT DECISION</p><span id="moisture"></span></div><h2 id="decision-title"></h2><p id="observation"></p><div id="decision-choices" class="choices"></div><div class="daily-actions" id="daily-actions"></div></div>
<div class="progress-footer"><div class="progress-copy"><span id="progress-copy"></span><div class="progress-track"><i id="progress-fill"></i></div></div><div class="advance"><button id="resume" hidden>Return to live</button><button id="next-day">One day +</button><button id="continue" class="primary">Continue <span>→</span></button></div></div></section>
</main>
<dialog id="drawer" aria-labelledby="drawer-title"><div class="drawer-top"><span class="eyebrow">A BOWL / EXPLORE</span><button id="close-drawer" aria-label="Close details">✕</button></div><h2 id="drawer-title"></h2><div id="drawer-content"></div></dialog><div id="status" class="toast" role="status" aria-live="polite"></div><input id="import-file" type="file" accept="application/json,.json" hidden>
<script>/* THREE */</script><script id="package-data">/* PACKAGE_DATA */</script><script id="simulation">/* SIMULATION */</script><script>/* SCENE_3D */</script><script>/* APPLICATION */</script></body></html>
